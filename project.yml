name: RilievoLiDAR
options:
  bundleIdPrefix: com.rilievo
  deploymentTarget:
    iOS: "16.0"
targets:
  RilievoLiDAR:
    type: application
    platform: iOS
    sources:
      - path: RilievoLiDAR
    scheme: {}
    info:
      path: RilievoLiDAR/Info.plist
      properties:
        CFBundleDisplayName: Rilievo LiDAR
        NSCameraUsageDescription: La fotocamera e il LiDAR servono per eseguire il rilievo della stanza.
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rilievo.lidar
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
